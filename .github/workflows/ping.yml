name: Telegram pings

on:
  # Triggered by cron-job.org at :01 and :31, 8am-11:31pm Australia/Melbourne (GitHub schedule never fired).
  workflow_dispatch:
    inputs:
      at:
        description: 'Simulate a Melbourne time, "YYYY-MM-DD HH:MM" (blank = now)'
        required: false
        default: ""
      mode:
        description: "slot = normal run, test = hello message + what this slot would send"
        required: false
        default: "test"
        type: choice
        options: [test, slot]

concurrency:
  group: telegram-pings
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send ping
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          PREFLIGHT_AT: ${{ github.event.inputs.at }}
          PREFLIGHT_MODE: ${{ github.event.inputs.mode || 'slot' }}
        run: python3 scripts/ping.py
